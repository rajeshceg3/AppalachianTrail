name: World verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [320, 390, 1440]
        motion: [normal, reduce]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node verification/check.cjs
        env:
          WIDTH: ${{ matrix.width }}
          MOTION: ${{ matrix.motion }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixels-${{ matrix.width }}-${{ matrix.motion }}
          path: verification/pixels
